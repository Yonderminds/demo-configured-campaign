name: Campaign check

# Proves every package in every campaign can be sold: a price in every currency the campaign
# offers, and the campaign's shipping countries listed. Read-only calls to the Campaigns API
# with the keys already in each slug's assets/config.js. Runs on every PR and once a week, so a
# price removed in the Campaigns App shows up here before a customer finds it on an upsell page.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  campaign-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Campaign check
        id: check
        run: node scripts/campaign-check.js
        continue-on-error: true
        env:
          CAMPAIGN_CHECK_REPORT: ${{ github.workspace }}/campaign-check-report.md

      # Only talks on the PR when something is wrong. A green run posts nothing; if an earlier
      # run left a comment, it is updated to the green one-liner so the thread stays short.
      - name: Post findings as a sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/campaign-check-report.md`;
            const marker = '<!-- campaign-check-report -->';
            const body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8')
              : `${marker}\n## 💱 Campaign check\n\n⚠️ The check did not produce a report (it may have crashed). See the workflow log.\n`;
            const failed = '${{ steps.check.outcome }}' === 'failure' || body.includes('🔴') || body.includes('🟡');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else if (failed) await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if a package has no price
        if: steps.check.outcome == 'failure'
        run: exit 1
