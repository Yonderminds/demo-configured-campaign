name: Deploy to GitHub Pages

# Builds every campaign from the repo root and publishes the merged _site/.
# netlify.toml rewrites are reproduced as static pages by scripts/pages-routes.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root build tooling
        run: npm ci
      - name: Smoke check
        run: node scripts/smoke-check.js
      - name: Build all campaigns
        run: node scripts/build.js
      - id: pages
        uses: actions/configure-pages@v5
      - name: Write rewrite pages and apply the base path
        run: node scripts/pages-routes.js
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
