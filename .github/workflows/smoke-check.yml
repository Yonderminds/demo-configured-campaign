name: Smoke check

# Runs the CPK smoke check on every PR and posts the findings as a sticky PR
# comment, so developers see them directly on the PR — they don't have access
# to Netlify deploy logs. Mirrors the validation Netlify runs before building.
#
# CONTEXT is intentionally left unset here, so this run behaves like a preview:
# a lingering Tailwind CDN reference is a (non-blocking) warning, while
# half-wired / broken states are errors that fail the check. The production
# hard-stop on a CDN reference still happens on Netlify's main deploy, where
# CONTEXT=production.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the speed checks diff against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run smoke check
        id: smoke
        continue-on-error: true
        env:
          SMOKE_CHECK_REPORT: ${{ github.workspace }}/smoke-check-report.md
          # Page-speed checks run only for the slugs this PR changes (empty outside PRs).
          SMOKE_CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/smoke-check.js

      - name: Post findings as a sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.SMOKE_CHECK_REPORT || `${process.env.GITHUB_WORKSPACE}/smoke-check-report.md`;
            const marker = '<!-- smoke-check-report -->';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `${marker}\n## 🚦 Smoke check\n\n⚠️ The smoke check did not produce a report (it may have crashed). Check the workflow logs.\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          SMOKE_CHECK_REPORT: ${{ github.workspace }}/smoke-check-report.md

      - name: Fail if the smoke check found errors
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke check reported errors — see the PR comment above."
          exit 1
