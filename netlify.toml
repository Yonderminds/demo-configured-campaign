[build]
  command = "node scripts/smoke-check.js && node scripts/build.js"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Redirect subdomain root to main store.
# Uncomment and replace <brand-domain> after provisioning (e.g. try.example.com -> https://example.com).
# [[redirects]]
#   from = "/"
#   to = "https://<brand-domain>"
#   status = 301
#   force = true

# The light wreath landing also answers on the merchant's old Shopify product URL, so existing ads
# and links keep working. 200 = rewrite: the address bar keeps /products/<handle> and Netlify serves
# the campaign landing (built at /christmas-diamond-painting-light-wreath/). Every asset and link on
# that page is root-absolute, and config.js declares storageScope, so the cart carries into checkout.
# The handle holds a sparkle and a gift emoji: the percent-encoded form (what browsers send) and the
# raw UTF-8 form are both listed, each with and without the trailing slash. Verify on the deploy
# preview which form Netlify matches.
[[redirects]]
  from = "/products/hot-sale-49-off%E2%9C%A8-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-%F0%9F%8E%81"
  to = "/christmas-diamond-painting-light-wreath/index.html"
  status = 200

[[redirects]]
  from = "/products/hot-sale-49-off%E2%9C%A8-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-%F0%9F%8E%81/"
  to = "/christmas-diamond-painting-light-wreath/index.html"
  status = 200

[[redirects]]
  from = "/products/hot-sale-49-off✨-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-🎁"
  to = "/christmas-diamond-painting-light-wreath/index.html"
  status = 200

[[redirects]]
  from = "/products/hot-sale-49-off✨-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-🎁/"
  to = "/christmas-diamond-painting-light-wreath/index.html"
  status = 200

# The Shopify product URL is the only public address for the landing: the campaign-root address
# 301s to it (force: a built file exists at that path). The rewrites above target index.html
# directly, so they never meet this redirect. Query strings (utm, affid) are kept by Netlify.
[[redirects]]
  from = "/christmas-diamond-painting-light-wreath/"
  to = "/products/hot-sale-49-off%E2%9C%A8-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-%F0%9F%8E%81"
  status = 301
  force = true

[[redirects]]
  from = "/christmas-diamond-painting-light-wreath"
  to = "/products/hot-sale-49-off%E2%9C%A8-christmas-diamond-painting-light-wreath-diy-kit-buy-2-get-free-shipping-%F0%9F%8E%81"
  status = 301
  force = true

# Cache static assets for 30 days — applies to all campaigns in the repo.
[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Web fonts are never edited in place (a new font is a new file), so they can be cached
# as immutable like images. CSS/JS are not: their filenames aren't hashed.
[[headers]]
  for = "/**/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/**/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

